<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request Access · ITICAS</title><link rel="stylesheet" href="/static/css/app.css"><style>body{min-height:100vh;display:grid;place-items:center;background:#07111d}.auth{width:min(520px,92vw);background:#0d1a2a;border:1px solid #20324a;border-radius:24px;padding:34px}.auth input,.auth textarea{width:100%;box-sizing:border-box;margin:7px 0 14px;padding:13px;border-radius:10px;border:1px solid #2b405d;background:#071321;color:#fff}.auth textarea{min-height:90px}.auth button{width:100%;padding:13px;border:0;border-radius:10px;background:#5fe6a8;font-weight:800}.err{color:#ff7e91}.ok{color:#5fe6a8}.small{color:#91a4bc;font-size:12px}.auth a{color:#68d8ff}</style></head><body><div class="auth"><h1>Request ITICAS access</h1><p class="small">The administrator will review your request. If approved, you will receive an email and can sign in with the password you create here.</p>{% if error %}<p class="err">{{ error }}</p>{% endif %}{% if success %}<p class="ok">{{ success }}</p>{% endif %}<form method="post" action="/register"><label>Full name<input name="full_name" required></label><label>Username<input name="username" required></label><label>Email<input type="email" name="email" required></label><label>Organisation<input name="organisation"></label><label>Phone<input name="phone"></label><label>Intended use<textarea name="intended_use" required></textarea></label><label>Password<input type="password" name="password" minlength="12" required></label><label>Confirm password<input type="password" name="confirm_password" minlength="12" required></label><button>Submit access request</button></form><p class="small"><a href="/login">Back to sign in</a></p><p class="small">{{ developer_credit }}</p></div></body></html>
