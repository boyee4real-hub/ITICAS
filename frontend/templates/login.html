<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · ITICAS</title><link rel="stylesheet" href="/static/css/app.css"><style>
body{min-height:100vh;display:grid;place-items:center;background:#07111d}.auth{width:min(430px,92vw);background:#0d1a2a;border:1px solid #20324a;border-radius:24px;padding:34px;box-shadow:0 25px 70px #0007}.auth h1{margin:8px 0}.auth input{width:100%;box-sizing:border-box;margin:7px 0 14px;padding:13px;border-radius:10px;border:1px solid #2b405d;background:#071321;color:#fff}.auth button{width:100%;padding:13px;border:0;border-radius:10px;background:#5fe6a8;font-weight:800}.err{color:#ff7e91}.small{color:#91a4bc;font-size:12px}.auth a{color:#68d8ff}.brand{color:#5fe6a8;font-weight:800;letter-spacing:.14em;font-size:12px}</style></head><body>
<div class="auth"><div class="brand">ITICAS · NIGERIA</div><h1>Secure sign in</h1><p class="small">Traffic intelligence, validation and prediction access is controlled by approved user permissions.</p>{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post" action="/login"><label>Username or email<input name="username" required autocomplete="username"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><button>Sign in</button></form>
<p class="small">Need access? <a href="/register">Request an account</a></p><p class="small">{{ developer_credit }}</p></div></body></html>
