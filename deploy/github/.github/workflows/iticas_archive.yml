
name: ITICAS Scheduled Archive Fallback

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call Supabase ITICAS collector
        env:
          SUPABASE_FUNCTION_URL: ${{ secrets.SUPABASE_FUNCTION_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          curl --fail --retry 3 --max-time 120 \
            -H "Content-Type: application/json" \
            -H "apikey: ${SUPABASE_SECRET_KEY}" \
            -d '{"trigger":"github_actions_fallback"}' \
            "${SUPABASE_FUNCTION_URL}"
